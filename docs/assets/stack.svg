<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 430" width="1160" height="430"
     role="img" aria-label="스택 인벤토리. 틸로 칠한 것이 온프렘 모드에서 실제로 쓰이며 외부 호출이 없는 구성이고, 회색은 클라우드 모드 전용, 점선은 미착수 항목이다.">
  <rect width="1160" height="430" fill="#0f1620"/>
  <rect x="0.5" y="0.5" width="1159" height="429" fill="none" stroke="#2a3646"/>

  <text x="28" y="38" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#c9d3e0">스택 · 온프렘 모드에서 실제로 도는 것</text>
  <text x="28" y="60" font-family="system-ui, sans-serif" font-size="12.5" fill="#7d8b9e">
    <tspan fill="#2dd4bf">틸</tspan> = 온프렘 기본값, 외부 호출 0. <tspan fill="#7d8b9e">회색</tspan> = 클라우드 모드 전용. <tspan fill="#7d8b9e">점선</tspan> = 미착수.
  </text>

  <!-- 1행 -->
  <line x1="28" y1="84" x2="1132" y2="84" stroke="#2a3646"/>
  <line x1="304" y1="84" x2="304" y2="256" stroke="#2a3646"/>
  <line x1="580" y1="84" x2="580" y2="256" stroke="#2a3646"/>
  <line x1="856" y1="84" x2="856" y2="256" stroke="#2a3646"/>
  <line x1="28" y1="256" x2="1132" y2="256" stroke="#2a3646"/>

  <text x="48" y="110" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9e">LLM / 임베딩</text>
  <rect x="48" y="124" width="112" height="30" fill="none" stroke="#2dd4bf"/>
  <text x="104" y="144" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#2dd4bf">Ollama</text>
  <rect x="170" y="124" width="112" height="30" fill="none" stroke="#2dd4bf"/>
  <text x="226" y="144" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#2dd4bf">BGE-M3</text>
  <rect x="48" y="164" width="112" height="30" fill="none" stroke="#2a3646"/>
  <text x="104" y="184" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#c9d3e0">upstage</text>
  <rect x="170" y="164" width="112" height="30" fill="none" stroke="#2a3646"/>
  <text x="226" y="184" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#c9d3e0">openai</text>
  <rect x="48" y="204" width="112" height="30" fill="none" stroke="#2a3646"/>
  <text x="104" y="224" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#c9d3e0">anthropic</text>

  <text x="600" y="110" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9e">검색 / 저장</text>
  <rect x="600" y="124" width="120" height="30" fill="none" stroke="#2dd4bf"/>
  <text x="660" y="144" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#2dd4bf">chromadb</text>
  <rect x="730" y="124" width="112" height="30" fill="none" stroke="#2dd4bf"/>
  <text x="786" y="144" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#2dd4bf">rank-bm25</text>
  <rect x="600" y="164" width="120" height="30" fill="none" stroke="#2dd4bf"/>
  <text x="660" y="184" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#2dd4bf">kiwipiepy</text>
  <text x="600" y="216" font-family="system-ui, sans-serif" font-size="10.5" fill="#7d8b9e">권한 필터가 여기서 걸린다.</text>
  <text x="600" y="232" font-family="system-ui, sans-serif" font-size="10.5" fill="#7d8b9e">프롬프트가 아니라 후보 단계다.</text>

  <text x="324" y="110" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9e">코퍼스</text>
  <rect x="324" y="124" width="232" height="30" fill="none" stroke="#2a3646"/>
  <text x="440" y="144" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#c9d3e0">사규 26종 · 183청크</text>
  <rect x="324" y="164" width="232" height="30" fill="none" stroke="#2a3646"/>
  <text x="440" y="184" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#c9d3e0">live 179 · superseded 4</text>
  <text x="324" y="216" font-family="system-ui, sans-serif" font-size="10.5" fill="#7d8b9e">가상 기업 한성산업. 더미데이터다.</text>
  <text x="324" y="232" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#7d8b9e">public 90 / internal 46 / conf 43</text>

  <text x="876" y="110" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9e">UI / 실행</text>
  <rect x="876" y="124" width="112" height="30" fill="none" stroke="#2dd4bf"/>
  <text x="932" y="144" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#2dd4bf">streamlit</text>
  <rect x="998" y="124" width="112" height="30" fill="none" stroke="#2a3646"/>
  <text x="1054" y="144" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#c9d3e0">numpy</text>
  <text x="876" y="180" font-family="system-ui, sans-serif" font-size="10.5" fill="#7d8b9e">배포하지 않는다. 내려받아</text>
  <text x="876" y="196" font-family="system-ui, sans-serif" font-size="10.5" fill="#7d8b9e">로컬에서 실행하는 데모다.</text>
  <text x="876" y="220" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#7d8b9e">streamlit run app.py</text>

  <!-- 2행 -->
  <line x1="580" y1="256" x2="580" y2="376" stroke="#2a3646"/>
  <line x1="28" y1="376" x2="1132" y2="376" stroke="#2a3646"/>

  <text x="48" y="282" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9e">평가 · 검증된 수치</text>
  <rect x="48" y="296" width="248" height="30" fill="none" stroke="#2dd4bf"/>
  <text x="172" y="316" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#2dd4bf">permission_matrix · 895조합 반례 0</text>
  <rect x="306" y="296" width="248" height="30" fill="none" stroke="#2dd4bf"/>
  <text x="430" y="316" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#2dd4bf">golden_set · 107문항</text>
  <text x="48" y="348" font-family="system-ui, sans-serif" font-size="10.5" fill="#7d8b9e">개발 54 / 홀드아웃 53으로 나눠 튜닝과 보고를 분리한다. 모든 비율에 표본 수와 95% 신뢰구간을 붙인다.</text>

  <text x="600" y="282" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9e">관측 · 미착수</text>
  <rect x="600" y="296" width="180" height="30" fill="none" stroke="#7d8b9e" stroke-dasharray="4 3"/>
  <text x="690" y="316" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#7d8b9e">arize-phoenix</text>
  <rect x="790" y="296" width="180" height="30" fill="none" stroke="#7d8b9e" stroke-dasharray="4 3"/>
  <text x="880" y="316" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#7d8b9e">logs/ 스키마</text>
  <text x="600" y="348" font-family="system-ui, sans-serif" font-size="10.5" fill="#7d8b9e">설계만 있고 코드가 없다. 점선은 전부 그런 뜻이다.</text>

  <text x="28" y="404" font-family="system-ui, sans-serif" font-size="11" fill="#7d8b9e">키가 하나도 없어도 BM25 검색·권한 전수 검사·검색 평가가 전부 돈다. 이 프로젝트의 보안 축과 측정 축은 외부 서비스에 의존하지 않는다.</text>
</svg>
